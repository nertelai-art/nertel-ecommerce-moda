name: Database
on:
  push:
    branches: [develop]
    paths:
      - "supabase/**"
      - "scripts/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/database.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true
jobs:
  schema-and-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build a fresh local database from migrations
        run: pnpm db:start
      - run: pnpm db:test
      - run: pnpm db:advisors
      # Porta contra la deriva. La base ombra aplica NOMÉS les migracions i es
      # compara amb la base viva: si en surt res, hi ha DDL que cap migració
      # explica. És el cas que a l'altre projecte va passar desapercebut.
      - name: La cadena de migracions ha de reproduir l'esquema real
        run: node scripts/check-drift.mjs
      - name: Stop this project only
        if: always()
        run: pnpm db:stop
