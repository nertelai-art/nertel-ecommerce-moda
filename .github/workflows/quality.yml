name: Quality
# Sense pull requests: el desenvolupador és una sola persona i la integració
# passa per merge commit cap a develop. La porta remota es dispara en pujar.
# Les portes barates ja s'han executat al hook de pre-push; aquí es repeteixen
# perquè un hook es pot saltar i aquesta és l'única comprovació que no.
on:
  push:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm
      # Dependabot handles advisory monitoring; npm's audit endpoint can hang CI.
      - run: npm ci --no-audit
      - run: npm run check
      - run: npm run build
